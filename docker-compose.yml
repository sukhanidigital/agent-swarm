services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Job history (SQLite) + the git worktrees every run creates — this is the only state that
      # needs to survive a container restart/redeploy.
      - ./jobs:/app/jobs
      # Target repos live outside the container by default; repo_path values you type into the app
      # need to resolve to somewhere inside it. Point REPOS_DIR (in .env) at wherever your projects
      # actually are on the host, and use /repos/<project> as the repo_path in the app.
      - ${REPOS_DIR:-./repos}:/repos
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time — see frontend/Dockerfile. Point this at wherever
        # the backend is actually reachable from a browser/phone (not "backend", the compose service
        # name — that only resolves inside this compose network).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8080:80"
    restart: unless-stopped
