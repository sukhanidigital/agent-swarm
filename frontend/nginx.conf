server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app, no server-side routes of its own (everything's a modal, not a URL) — this
    # just means a reload never 404s if that ever changes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
